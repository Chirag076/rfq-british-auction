# Render Blueprint — one-click deploy of the whole stack.
#
#   https://dashboard.render.com/blueprints  →  New Blueprint Instance
#
# Three resources: a Postgres database, the NestJS API from backend/Dockerfile,
# and the React build served as a static site.
#
# One manual step after the first sync, and it cannot be avoided: the static
# site needs the API's public URL at BUILD time (Vite inlines VITE_* values
# into the bundle), and Render does not expose a service's public URL to
# another service's environment. So the placeholder below has to be replaced
# with the real API URL once Render has created it, then the site rebuilt.
# See the deployment section of the README.

databases:
  - name: rfq-db
    databaseName: rfq
    user: rfq
    plan: free
    region: oregon

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: rfq-api
    runtime: docker
    plan: free
    region: oregon # must match the database: a free service reaches it over the private network
    # Both paths are relative to the repo root, not to rootDir, so rootDir is
    # left off here rather than risking the ambiguity.
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Push the schema before the app boots, exactly as docker-compose does.
    # The API seeds itself on first boot only if the database is empty.
    dockerCommand: sh -c "npx prisma db push --skip-generate && node dist/main"
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rfq-db
          property: connectionString

  # ------------------------------------------------------------------ Web
  - type: web
    name: rfq-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # REPLACE after the first deploy with the API's real URL, then choose
      # "Clear build cache & deploy" so the new value is compiled in.
      - key: VITE_API_BASE
        value: https://rfq-api.onrender.com
    routes:
      # Client-side routing: /rfq/:id is a React route, not a file on disk.
      # Render skips rewrite rules for paths that do exist, so /assets/* is
      # still served normally.
      - type: rewrite
        source: /*
        destination: /index.html
