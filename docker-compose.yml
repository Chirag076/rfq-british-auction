# One command to run everything:  docker compose up --build
#
#   web   http://localhost:5173
#   api   http://localhost:4000
#   db    postgres on 5432
#
# The api container pushes the schema and seeds an empty database before it
# serves anything, so a reviewer gets a live auction without running a second
# command. It uses the image's own start-up script — the same one the deployed
# instance runs, so the start path is not something only production exercises.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rfq
      POSTGRES_PASSWORD: rfq
      POSTGRES_DB: rfq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # The api waits for this rather than sleeping: a fixed sleep is either
      # too short on a cold machine or wasted time on a warm one.
      test: ["CMD-SHELL", "pg_isready -U rfq -d rfq"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://rfq:rfq@db:5432/rfq?schema=public
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:4000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
